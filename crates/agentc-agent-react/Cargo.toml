[package]
name = "agentc-agent-react"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = []

api = [
    "dep:agentc-http",
    "agentc-http/server",
    "dep:axum",
    "dep:utoipa",
    "dep:utoipa-axum",
    "dep:jobq",
    "dep:subway",
    "dep:validator",
]

tls = ["api", "agentc-http/tls"]

ag-ui = ["api", "dep:agentc-protocol-ag-ui"]
a2a = ["api", "dep:agentc-protocol-a2a"]

[dependencies]
agentc-model = { path = "../agentc-model", version = "0.3.1" }
agentc-agent = { path = "../agentc-agent", version = "0.3.1" }
agentc-prompt = { path = "../agentc-prompt", version = "0.3.1" }
agentc-database = { path = "../agentc-database", version = "0.3.1" }
agentc-domain = { path = "../agentc-domain", version = "0.3.1" }
agentc-domain-sql = { path = "../agentc-domain-sql", version = "0.3.1" }
agentc-http = { path = "../agentc-http", version = "0.3.1", optional = true }
agentc-telemetry = { path = "../agentc-telemetry", version = "0.3.1" }

agentc-protocol-ag-ui = { path = "../agentc-protocol-ag-ui", version = "0.3.1", optional = true }
agentc-protocol-a2a = { path = "../agentc-protocol-a2a", version = "0.3.1", optional = true, default-features = false, features = ["server"] }

futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true, optional = true }
chrono = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
json-patch = { workspace = true }
utoipa = { workspace = true, optional = true }

axum = { workspace = true, optional = true }
utoipa-axum = { workspace = true, optional = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

jobq = { workspace = true, optional = true }
subway = { workspace = true, optional = true }
