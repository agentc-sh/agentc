[package]
name = "agentc-tools"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = ["bash", "python-embedded"]
javascript = ["dep:rquickjs", "dep:rquickjs-serde", "dep:llrt_modules", "dep:oxc"]
python-embedded = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]
python-static = ["dep:pyo3", "dep:pythonize"]
bash = ["dep:rust-bash"]

[dependencies]
agentc-agent = { path = "../agentc-agent", version = "0.2.1" }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
sanitizer = { workspace = true }
json-patch = { workspace = true }

schemars = { workspace = true }

rquickjs = { version = "0.11", features = ["full-async"], optional = true }
rquickjs-serde = { version = "0.5", optional = true }
llrt_modules = { git = "https://github.com/awslabs/llrt", rev = "e64c2b7601", default-features = false, features = ["crypto-ring", "base", "console", "tls-ring"], optional = true }
oxc = { version = "*", features = ["transformer", "codegen"], optional = true }

rustpython-vm = { git = "https://github.com/RustPython/RustPython", rev = "0.5.0", features = ["freeze-stdlib", "serde", "threading"], optional = true }
rustpython-stdlib = { git = "https://github.com/RustPython/RustPython", rev = "0.5.0", optional = true }
rustpython-pylib = { git = "https://github.com/RustPython/RustPython", rev = "0.5.0", features = ["freeze-stdlib"], optional = true }

pyo3 = { version = "0.29", features = ["chrono", "serde", "uuid", "macros"], optional = true }
pythonize = { version = "0.29", optional = true }

rust-bash = { version = "0.3", optional = true }
