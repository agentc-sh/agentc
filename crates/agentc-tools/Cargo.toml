[package]
name = "agentc-tools"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = ["bash", "python-embedded"]
javascript = [
    "dep:agentc-executor-typescript",
]
python-embedded = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]
python-static = ["dep:pyo3", "dep:pythonize", "dep:include_dir"]
bash = ["dep:rust-bash"]

[dependencies]
agentc-agent = { path = "../agentc-agent", version = "0.3.1" }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
sanitizer = { workspace = true }
json-patch = { workspace = true }

schemars = { workspace = true }

rustpython-vm = { git = "https://github.com/RustPython/RustPython", rev = "ede18e4", features = ["freeze-stdlib", "serde", "threading"], optional = true }
rustpython-stdlib = { git = "https://github.com/RustPython/RustPython", rev = "ede18e4", optional = true }
rustpython-pylib = { git = "https://github.com/RustPython/RustPython", rev = "ede18e4", features = ["freeze-stdlib"], optional = true }

pyo3 = { version = "0.29", features = ["chrono", "serde", "uuid", "macros"], optional = true }
pythonize = { version = "0.29", optional = true }
include_dir = { version = "0.7", optional = true }

rust-bash = { version = "0.3", optional = true }

agentc-executor-typescript = { path = "../agentc-executor-typescript", version = "0.3.1", optional = true }
