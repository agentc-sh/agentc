name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out before building binaries
        required: true
        type: string
      version_tag:
        description: Version tag embedded into built binary artifacts
        required: true
        type: string
      release_channel:
        description: Release channel embedded into binary metadata
        required: true
        type: string
      edition:
        description: Edition embedded into binary metadata
        required: false
        default: community
        type: string
      targets:
        description: Comma-separated binary targets to build, for example linux-x86_64 or linux-x86_64,linux-aarch64
        required: false
        default: linux-x86_64,linux-aarch64
        type: string
      signing_enabled:
        description: Whether signing and attestation steps should run
        required: false
        default: false
        type: boolean
      signing_identity_regexp:
        description: Certificate identity regexp used when verifying signed binaries
        required: false
        default: ""
        type: string

jobs:
  prepare-matrix:
    name: Prepare binary matrix
    runs-on: ubuntu-latest
    outputs:
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}
    steps:
      - name: Compute target matrix
        id: matrix
        run: |
          INPUT_TARGETS="${{ inputs.targets }}"
          INPUT_TARGETS="${INPUT_TARGETS// /}"

          if [[ -z "$INPUT_TARGETS" ]]; then
            echo "targets input must not be empty"
            exit 1
          fi

          declare -A SEEN_TARGETS=()
          TARGET_ENTRIES=()

          IFS=',' read -r -a REQUESTED_TARGETS <<< "$INPUT_TARGETS"

          for requested_target in "${REQUESTED_TARGETS[@]}"; do
            case "$requested_target" in
              linux-x86_64)
                TARGET_NAME="linux-x86_64"
                TARGET_OS="ubuntu-latest"
                TARGET_TRIPLE="x86_64-unknown-linux-gnu"
                TARGET_PLATFORM_NAME="linux-x86_64"
                TARGET_ARTIFACT_SUFFIX="linux-x86_64"
                ;;
              linux-aarch64)
                TARGET_NAME="linux-aarch64"
                TARGET_OS="ubuntu-24.04-arm"
                TARGET_TRIPLE="aarch64-unknown-linux-gnu"
                TARGET_PLATFORM_NAME="linux-aarch64"
                TARGET_ARTIFACT_SUFFIX="linux-aarch64"
                ;;
              darwin-x86_64)
                TARGET_NAME="darwin-x86_64"
                TARGET_OS="macos-latest"
                TARGET_TRIPLE="x86_64-apple-darwin"
                TARGET_PLATFORM_NAME="darwin-x86_64"
                TARGET_ARTIFACT_SUFFIX="darwin-x86_64"
                ;;
              darwin-aarch64)
                TARGET_NAME="darwin-aarch64"
                TARGET_OS="macos-latest"
                TARGET_TRIPLE="aarch64-apple-darwin"
                TARGET_PLATFORM_NAME="darwin-aarch64"
                TARGET_ARTIFACT_SUFFIX="darwin-aarch64"
                ;;
              windows-x86_64)
                TARGET_NAME="windows-x86_64"
                TARGET_OS="windows-latest"
                TARGET_TRIPLE="x86_64-pc-windows-msvc"
                TARGET_PLATFORM_NAME="windows-x86_64"
                TARGET_ARTIFACT_SUFFIX="windows-x86_64"
                ;;
              *)
                echo "Unsupported target: $requested_target"
                exit 1
                ;;
            esac

            if [[ -n "${SEEN_TARGETS[$TARGET_NAME]}" ]]; then
              continue
            fi

            SEEN_TARGETS[$TARGET_NAME]=1
            TARGET_ENTRIES+=("{\"name\":\"${TARGET_NAME}\",\"os\":\"${TARGET_OS}\",\"triple\":\"${TARGET_TRIPLE}\",\"platform_name\":\"${TARGET_PLATFORM_NAME}\",\"artifact_suffix\":\"${TARGET_ARTIFACT_SUFFIX}\"}")
          done

          TARGET_MATRIX="["

          for index in "${!TARGET_ENTRIES[@]}"; do
            if [[ "$index" -gt 0 ]]; then
              TARGET_MATRIX+=","
            fi

            TARGET_MATRIX+="${TARGET_ENTRIES[$index]}"
          done

          TARGET_MATRIX+="]"

          echo "target_matrix=${TARGET_MATRIX}" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build binaries (${{ matrix.target.triple }})
    needs: [prepare-matrix]
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-matrix.outputs.target_matrix) }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      BIN_NAME: agentc
      ASSET_TAG: ${{ inputs.version_tag }}
      BUILD_TAG: ${{ inputs.version_tag }}
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Add Rust target
        if: runner.os != 'Linux'
        run: rustup target add "${{ matrix.target.triple }}"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Install Cosign
        if: inputs.signing_enabled
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build binary
        run: |
          export BUILD_TAG="${ASSET_TAG}"

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cross build --package "${BIN_NAME}" --release --target "${{ matrix.target.triple }}"
          else
            cargo build --package "${BIN_NAME}" --release --target "${{ matrix.target.triple }}"
          fi

      - name: Prepare release files
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"
          SOURCE_PATH="target/${{ matrix.target.triple }}/release/${BIN_NAME}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            SOURCE_PATH="${SOURCE_PATH}.exe"
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          mkdir -p dist
          cp "$SOURCE_PATH" "dist/${ARTIFACT_NAME}"

      - name: Generate checksum
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cd dist
          sha256sum "${ARTIFACT_NAME}" | awk '{ print $1 }' > "${ARTIFACT_NAME}.sha256"

      - name: Generate metadata
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cat > "dist/${ARTIFACT_NAME}.metadata.json" <<EOF
          {
            "com.agentc.name": "${ARTIFACT_NAME}",
            "com.agentc.vendor": "agentc-sh",
            "com.agentc.version": "${ASSET_TAG}",
            "com.agentc.revision": "${GITHUB_SHA}",
            "com.agentc.ref": "${{ inputs.ref }}",
            "com.agentc.created": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "com.agentc.build-id": "${{ github.run_id }}",
            "com.agentc.product": "agentc",
            "com.agentc.edition": "${{ inputs.edition }}",
            "com.agentc.release-channel": "${{ inputs.release_channel }}",
            "com.agentc.licenses": "MIT",
            "com.agentc.support": "https://github.com/agentc-sh/agentc/issues"
          }
          EOF

      - name: Generate SBOM
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          "${{ steps.syft.outputs.cmd }}" "dist/${ARTIFACT_NAME}" -o cyclonedx-json="dist/${ARTIFACT_NAME}.sbom.cdx.json" -q

      - name: Generate scan report
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          "${{ steps.grype.outputs.cmd }}" "sbom:dist/${ARTIFACT_NAME}.sbom.cdx.json" --output json > "dist/${ARTIFACT_NAME}.scan.json"

      - name: Sign binary
        if: inputs.signing_enabled
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cosign sign-blob \
            --yes \
            --bundle "dist/${ARTIFACT_NAME}.sigstore.json" \
            "dist/${ARTIFACT_NAME}"

      - name: Verify binary signature
        if: inputs.signing_enabled
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cosign verify-blob \
            --bundle "dist/${ARTIFACT_NAME}.sigstore.json" \
            --certificate-identity-regexp "${{ inputs.signing_identity_regexp }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/${ARTIFACT_NAME}"

      - name: Attest build provenance
        if: inputs.signing_enabled
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}${{ matrix.target.triple == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

      - name: Verify build provenance
        if: inputs.signing_enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.target.artifact_suffix }}"

          if [[ "${{ matrix.target.triple }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          gh attestation verify "dist/${ARTIFACT_NAME}" --repo "${{ github.repository }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.platform_name }}
          path: |
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.sha256
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.metadata.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.sbom.cdx.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.scan.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.sigstore.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.exe
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.exe.sha256
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.exe.metadata.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.exe.sbom.cdx.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.exe.scan.json
            dist/${{ env.BIN_NAME }}-${{ matrix.target.artifact_suffix }}.exe.sigstore.json
