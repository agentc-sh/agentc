name: rc

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: dev
        type: string
      publish_prerelease:
        description: Publish the built RC artifacts as a GitHub prerelease
        required: true
        default: false
        type: boolean

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: agentc-sh/agentc
  IMAGE_URI: ghcr.io/agentc-sh/agentc
  BIN_NAME: agentc
  RELEASE_CHANNEL: rc
  EDITION: community
  ENABLE_SIGNING: 'false'

jobs:
  prepare:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    name: Prepare RC build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asset_tag: ${{ steps.vars.outputs.asset_tag }}
      ref_name: ${{ steps.validate.outputs.ref_name }}
    steps:
      - name: Validate ref
        id: validate
        run: |
          if [[ "${{ inputs.ref }}" != "dev" ]]; then
            echo "The rc workflow may only be run against the dev branch."
            exit 1
          fi

          echo "ref_name=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.validate.outputs.ref_name }}
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.43.3

      - name: Compute asset tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ASSET_TAG=$(task version:next PRE_RELEASE="rc.${{ github.run_number }}.${SHORT_SHA}")

          echo "asset_tag=$ASSET_TAG" >> "$GITHUB_OUTPUT"
          echo "Asset tag: $ASSET_TAG"

  build-binaries:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    needs: [prepare]
    uses: ./.github/workflows/build.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
    with:
      ref: ${{ needs.prepare.outputs.ref_name }}
      version_tag: ${{ needs.prepare.outputs.asset_tag }}
      release_channel: rc
      edition: community
      targets: ${{ inputs.publish_prerelease && !github.event.repository.private && 'linux-x86_64,linux-aarch64' || 'linux-x86_64' }}
      signing_enabled: ${{ !github.event.repository.private && inputs.publish_prerelease }}
      signing_identity_regexp: ^https://github\.com/${{ github.repository }}/\.github/workflows/rc\.yml@.*$
    secrets: inherit

  build-docker-toolchain:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    needs: [prepare]
    uses: ./.github/workflows/oci.yml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      security-events: write
    with:
      ref: ${{ needs.prepare.outputs.ref_name }}
      image_uri: ghcr.io/agentc-sh/agentc
      version_tag: ${{ needs.prepare.outputs.asset_tag }}
      publish: ${{ inputs.publish_prerelease }}
      release_channel: rc
      edition: community
      variant: toolchain
      task: docker:build:toolchain
      tag_suffix: toolchain
      architectures: ${{ inputs.publish_prerelease && !github.event.repository.private && 'amd64,arm64' || 'amd64' }}
    secrets: inherit

  make-prerelease:
    if: |
      inputs.publish_prerelease &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    name: Create GitHub prerelease
    needs: [prepare, build-binaries, build-docker-toolchain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref_name }}
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.43.3

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Create prerelease notes
        run: |
          git fetch origin main

          LAST_MERGE_COMMIT=$(git merge-base origin/main HEAD)
          task version:changelog -- --unreleased --tag "${{ needs.prepare.outputs.asset_tag }}" "${LAST_MERGE_COMMIT}..HEAD" \
            | awk 'BEGIN { skipping=1 } skipping && /^## \[/ { skipping=0 } !skipping { print }' > release_notes.md

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.asset_tag }}
          target_commitish: ${{ needs.prepare.outputs.ref_name }}
          name: ${{ needs.prepare.outputs.asset_tag }}
          body_path: release_notes.md
          prerelease: true
          draft: true
          make_latest: false
          files: artifacts/**/*

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.prepare.outputs.asset_tag }}" --draft=false --prerelease
