name: rc

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: dev
        type: string
      publish_prerelease:
        description: Publish the built RC artifacts as a GitHub prerelease
        required: true
        default: false
        type: boolean

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: agentc-sh/agentc
  IMAGE_URI: ghcr.io/agentc-sh/agentc
  BIN_NAME: agentc
  RELEASE_CHANNEL: rc
  EDITION: community
  ENABLE_SIGNING: 'false'

jobs:
  prepare:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    name: Prepare RC build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asset_tag: ${{ steps.vars.outputs.asset_tag }}
      ref_name: ${{ steps.validate.outputs.ref_name }}
    steps:
      - name: Validate ref
        id: validate
        run: |
          if [[ "${{ inputs.ref }}" != "dev" ]]; then
            echo "The rc workflow may only be run against the dev branch."
            exit 1
          fi

          echo "ref_name=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.validate.outputs.ref_name }}
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.43.3

      - name: Compute asset tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ASSET_TAG=$(task version:next PRE_RELEASE="rc.${{ github.run_number }}.${SHORT_SHA}")

          echo "asset_tag=$ASSET_TAG" >> "$GITHUB_OUTPUT"
          echo "Asset tag: $ASSET_TAG"

  build-binaries:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    name: Build binaries (${{ matrix.target }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_name: linux-x86_64
            artifact_suffix: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform_name: linux-aarch64
            artifact_suffix: linux-aarch64
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   platform_name: darwin-x86_64
          #   artifact_suffix: darwin-x86_64
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   platform_name: darwin-aarch64
          #   artifact_suffix: darwin-aarch64
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   platform_name: windows-x86_64
          #   artifact_suffix: windows-x86_64
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.asset_tag }}
      ASSET_TAG: ${{ needs.prepare.outputs.asset_tag }}
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref_name }}
          fetch-depth: 0

      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Add Rust target
        if: runner.os != 'Linux'
        run: rustup target add "${{ matrix.target }}"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Install Cosign
        if: env.ENABLE_SIGNING == 'true' && inputs.publish_prerelease
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build binary
        run: |
          export BUILD_TAG="${ASSET_TAG}"

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cross build --package "${BIN_NAME}" --release --target "${{ matrix.target }}"
          else
            cargo build --package "${BIN_NAME}" --release --target "${{ matrix.target }}"
          fi

      - name: Prepare release files
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"
          SOURCE_PATH="target/${{ matrix.target }}/release/${BIN_NAME}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            SOURCE_PATH="${SOURCE_PATH}.exe"
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          mkdir -p dist
          cp "$SOURCE_PATH" "dist/${ARTIFACT_NAME}"

      - name: Generate checksum
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cd dist
          sha256sum "${ARTIFACT_NAME}" | awk '{ print $1 }' > "${ARTIFACT_NAME}.sha256"

      - name: Generate metadata
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cat > "dist/${ARTIFACT_NAME}.metadata.json" <<EOF
          {
            "com.agentc.name": "${ARTIFACT_NAME}",
            "com.agentc.vendor": "agentc-sh",
            "com.agentc.version": "${ASSET_TAG}",
            "com.agentc.revision": "${GITHUB_SHA}",
            "com.agentc.ref": "${{ needs.prepare.outputs.ref_name }}",
            "com.agentc.created": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "com.agentc.build-id": "${{ github.run_id }}",
            "com.agentc.product": "agentc",
            "com.agentc.edition": "${EDITION}",
            "com.agentc.release-channel": "${RELEASE_CHANNEL}",
            "com.agentc.licenses": "MIT",
            "com.agentc.support": "https://github.com/agentc-sh/agentc/issues"
          }
          EOF

      - name: Generate SBOM
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          "${{ steps.syft.outputs.cmd }}" "dist/${ARTIFACT_NAME}" -o cyclonedx-json="dist/${ARTIFACT_NAME}.sbom.cdx.json" -q

      - name: Generate scan report
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          "${{ steps.grype.outputs.cmd }}" "sbom:dist/${ARTIFACT_NAME}.sbom.cdx.json" --output json > "dist/${ARTIFACT_NAME}.scan.json"

      - name: Sign binary
        if: env.ENABLE_SIGNING == 'true' && inputs.publish_prerelease
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cosign sign-blob \
            --yes \
            --bundle "dist/${ARTIFACT_NAME}.sigstore.json" \
            "dist/${ARTIFACT_NAME}"

      - name: Verify binary signature
        if: env.ENABLE_SIGNING == 'true' && inputs.publish_prerelease
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          cosign verify-blob \
            --bundle "dist/${ARTIFACT_NAME}.sigstore.json" \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/\\.github/workflows/rc\\.yml@.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/${ARTIFACT_NAME}"

      - name: Attest build provenance
        if: env.ENABLE_SIGNING == 'true' && inputs.publish_prerelease
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

      - name: Verify build provenance
        if: env.ENABLE_SIGNING == 'true' && inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${BIN_NAME}-${{ matrix.artifact_suffix }}"

          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}.exe"
          fi

          gh attestation verify "dist/${ARTIFACT_NAME}" --repo "${{ github.repository }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform_name }}
          path: |
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.sha256
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.metadata.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.sbom.cdx.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.scan.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.sigstore.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.exe
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.exe.sha256
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.exe.metadata.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.exe.sbom.cdx.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.exe.scan.json
            dist/${{ env.BIN_NAME }}-${{ matrix.artifact_suffix }}.exe.sigstore.json

  build-docker:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    needs: [prepare]
    name: Build docker image (${{ matrix.image_variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_variant:
          # - name: slim
          #   task: docker:build:slim
          #   tag_suffix: slim
          - name: toolchain
            task: docker:build:toolchain
            tag_suffix: toolchain
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref_name }}
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.43.3

      - name: Compute image tags
        id: image
        run: |
          echo "version_tag=${{ needs.prepare.outputs.asset_tag }}-${{ matrix.image_variant.tag_suffix }}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_URI}:${{ needs.prepare.outputs.asset_tag }}-${{ matrix.image_variant.tag_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: inputs.publish_prerelease
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI image
        run: |
          task ${{ matrix.image_variant.task }} \
            IMAGE_NAME=${{ env.IMAGE_URI }} \
            IMAGE_TAG=${{ steps.image.outputs.version_tag }}

      - name: Generate OCI Image SBOM SPDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.image_ref }}
          format: spdx-json
          output-file: sbom/sbom.oci.${{ matrix.image_variant.tag_suffix }}.spdx.json
          artifact-name: sbom.oci.${{ matrix.image_variant.tag_suffix }}.spdx.json

      - name: Generate OCI Image SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.image_ref }}
          format: cyclonedx-json
          output-file: sbom/sbom.oci.${{ matrix.image_variant.tag_suffix }}.cyclonedx.json
          artifact-name: sbom.oci.${{ matrix.image_variant.tag_suffix }}.cyclonedx.json

      - name: Scan OCI image
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ steps.image.outputs.image_ref }}
          fail-build: true
          severity-cutoff: critical

      - name: Upload OCI SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-oci-${{ matrix.image_variant.tag_suffix }}
          path: sbom/sbom.oci.${{ matrix.image_variant.tag_suffix }}.*.json

      - name: Inspect SARIF report
        if: always()
        run: |
          cat "${{ steps.scan.outputs.sarif }}"

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Push OCI image
        if: inputs.publish_prerelease
        run: |
          docker push "${{ steps.image.outputs.image_ref }}"

  make-prerelease:
    if: |
      inputs.publish_prerelease &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    name: Create GitHub prerelease
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref_name }}
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.43.3

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Create prerelease notes
        run: |
          git fetch origin main

          LAST_MERGE_COMMIT=$(git merge-base origin/main HEAD)
          task version:changelog -- --unreleased --tag "${{ needs.prepare.outputs.asset_tag }}" "${LAST_MERGE_COMMIT}..HEAD" \
            | awk 'BEGIN { skipping=1 } skipping && /^## \[/ { skipping=0 } !skipping { print }' > release_notes.md

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.asset_tag }}
          target_commitish: ${{ needs.prepare.outputs.ref_name }}
          name: ${{ needs.prepare.outputs.asset_tag }}
          body_path: release_notes.md
          prerelease: true
          draft: true
          make_latest: false
          files: artifacts/**/*

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.prepare.outputs.asset_tag }}" --draft=false --prerelease
