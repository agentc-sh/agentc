name: release

on:
  push:
    tags: ["*"]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: agentc-sh/agentc
  IMAGE_URI: ghcr.io/agentc-sh/agentc
  BIN_NAME: agentc
  RELEASE_CHANNEL: stable
  EDITION: community
  ENABLE_SIGNING: 'false'

jobs:
  generate-sbom:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: "3.43.3"

      - name: Generate SBOM SPDX
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom/sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Generate SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom/sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

  build-binaries:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    uses: ./.github/workflows/build.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
    with:
      ref: ${{ github.ref_name }}
      version_tag: ${{ github.ref_name }}
      release_channel: stable
      edition: community
      targets: ${{ !github.event.repository.private && 'linux-x86_64,linux-aarch64,darwin-x86_64,darwin-aarch64,windows-x86_64' || 'linux-x86_64' }}
      signing_enabled: ${{ env.ENABLE_SIGNING == 'true' }}
      signing_identity_regexp: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@.*$
    secrets: inherit

  build-docker-slim:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    needs: [generate-sbom]
    uses: ./.github/workflows/oci.yml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      security-events: write
    with:
      ref: ${{ github.ref_name }}
      image_uri: ghcr.io/agentc-sh/agentc
      version_tag: ${{ github.ref_name }}
      publish: true
      release_channel: stable
      edition: community
      variant: slim
      task: docker:build:slim
      tag_suffix: slim
      architectures: amd64,arm64
      sbom_artifact_name: sbom
      channel_alias: slim
    secrets: inherit

  build-docker-toolchain:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    needs: [generate-sbom]
    uses: ./.github/workflows/oci.yml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      security-events: write
    with:
      ref: ${{ github.ref_name }}
      image_uri: ghcr.io/agentc-sh/agentc
      version_tag: ${{ github.ref_name }}
      publish: true
      release_channel: stable
      edition: community
      variant: toolchain
      task: docker:build:toolchain
      tag_suffix: toolchain
      architectures: amd64,arm64
      sbom_artifact_name: sbom
      channel_alias: toolchain
    secrets: inherit

  make-release:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'agentc-sh/agentc'
    needs: [build-binaries]
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.43.3

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG=$(task version:current)
          PREV_VERSION=$(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -n 2 | tail -n 1 | sed -E 's/^## \[([^]]+)\].*/\1/')
          
          awk -v tag="$TAG" '
            # Start when we hit the current version header
            $0 ~ "^## \\[" tag "\\]" { printing=1; next }

            # Stop when we hit the next version header
            printing && $0 ~ "^## \\[" { exit }

            printing
          ' CHANGELOG.md > release_notes.md
          
          echo "Release notes for $TAG:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
